<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹사이트 따라만들기(크롬)</title>
    <meta name="description" content="웹사이트 따라만들기">
    <link rel="stylesheet" href="test2.css">
</head>
<body>
    <div class="top-right-links">
        <a href="https://mail.google.com/" target="_blank">Gmail</a>

    <div class="button-container">
        <button class="site-button" onclick="location.href='https://www.naver.com/'">네이버</button>
        <button class="site-button" onclick="location.href='https://www.youtube.com/'">유튜브</button>

</html>
