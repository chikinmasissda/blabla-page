<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹사이트 따라만들기(크롬)</title>
    <meta name="description" content="웹사이트 따라만들기">
    <link rel="stylesheet" href="test2.css">
</head>

<body>
    <div class="top-right-links">
        <a href="https://mail.google.com/" target="_blank">Gmail</a>
        <a href="https://www.google.com/imghp" target="_blank">이미지</a>
    </div>  
 
    <header class="header">
        <img class="googlelogo" src="google.svg" alt="구글">
    </header>

    <div class="search-bar">
        <button class="icon-button">
            <img class="btn-icon" src="add_old.svg" alt="+">
        </button>
        <input type="text" class="search-input" placeholder="Google에 물어보기">
        <button class="icon-button">
            <img class="btn-icon" src="mic_old.svg" alt="마이크">
        </button>
        <button class="icon-button">
            <img class="btn-icon" src="camera.svg" alt="카메라">
        </button>
        <button class="ai-mode-button">
            <img class="ai-mode-icon" src="search_spark.svg" alt="+">AI 모드
        </button>
        <div class="search-history">
            <a href="index.html" class="history-item">
                <span class="history-icon">🕑</span>
                <span>자기소개 웹사이트</span>
            </a>
            <a href="index2.html" class="history-item">
                <span class="history-icon">🕑</span>
                <span>크롬 따라만들기</span>
            </a>
        </div>
    </div>
    
    <div class="subtask">
        <button class="ai-tab">
            <img class="ai-tab-image" src="ai-work.svg" alt="ai 모드로 일하기" style="filter: brightness(3);">
            <div class="ai-tab-text">
                <p class="tab-title">AI 모드로 더 많은 작업 수행</p>
                <p class="tab-desc">생성, 요약, 계획</p>
            </div>
        </button>

        <button class="ai-tab">
            <img class="ai-tab-image" src="ai-image.svg" alt="ai로 사진만들기">
            <div class="ai-tab-text">
                <p class="tab-title">이미지 만들기</p>
                <p class="tab-desc">재구성, 삽화 추가, 수정</p>
            </div>
        </button>
    </div>

    <div class="button-container">
        <div class="shortcut-item" onclick="location.href='https://www.naver.com/'">
            <div class="site-button">
                <img src="https://www.google.com/s2/favicons?domain=naver.com&sz=64" alt="네이버" class="site-icon">
            </div>
            <span class="site-name">네이버</span>
        </div>

        <div class="shortcut-item" onclick="location.href='https://www.youtube.com/'">
            <div class="site-button">
                <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64" alt="유튜브" class="site-icon">
            </div>
            <span class="site-name">유튜브</span>
        </div>

        <div class="shortcut-item" onclick="location.href='https://www.github.com/'">
            <div class="site-button">
                <img src="https://www.google.com/s2/favicons?domain=github.com&sz=64" alt="깃허브" class="site-icon">
            </div>
            <span class="site-name">깃허브</span>
        </div>
    </div>
</body>
</html>
